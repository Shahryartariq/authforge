name: Bug report
description: Something doesn't work the way the README says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a **security** problem? Please don't post it here. Report it privately: see [SECURITY.md](https://github.com/Shahryartariq/authforge/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign up with ...
        2. Open /settings
        3. ...
    validations:
      required: true
  - type: dropdown
    id: orm
    attributes:
      label: ORM
      options: [Drizzle, Prisma, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Authforge version or commit
      placeholder: v1.1.0, or a commit hash
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console output
      description: Remove secrets, tokens and real email addresses first.
      render: text
